<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hack Idea Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f5; --ink: #12304a; --muted: #56707f;
    --card: #ffffff; --line: #c5d3db; --berry: #b3203e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Familjen Grotesk", system-ui, sans-serif; line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; margin: 0 0 12px; letter-spacing: -0.02em; }
  .intro { color: var(--muted); max-width: 46ch; margin: 0 0 32px; }
  .slots { display: grid; gap: 12px; }
  .slot {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .slot.locked { border-color: var(--ink); border-width: 2px; padding: 15px 17px; }
  .label { font-size: 0.85rem; color: var(--muted); margin: 0; }
  .value { font-size: 1.35rem; font-weight: 600; margin: 2px 0 0; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--ink);
    background: transparent; color: var(--ink); padding: 8px 14px;
  }
  button:hover { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; }
  .spin {
    margin-top: 20px; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: 700;
    background: var(--berry); border-color: var(--berry); color: #fff;
  }
  .spin:hover { background: #8f1832; border-color: #8f1832; color: #fff; }
  .pitch { margin-top: 28px; font-size: 1.1rem; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Hack Idea Roulette</h1>
  <p class="intro">Stuck before a hackathon? Spin for a problem, a technology and a twist. Lock the ones you like and spin again.</p>

  <div class="slots" id="slots"></div>
  <button class="spin" id="spin">Spin</button>
  <p class="pitch" id="pitch" aria-live="polite"></p>

  <footer>Built as a first GitHub project. Edit the lists in <code>index.html</code> to add your own ideas.</footer>
</main>

<script>
  // Edit these lists to make the generator your own.
  const DATA = [
    { key: "Problem", items: [
      "reducing food waste", "finding a study group", "making public transport easier",
      "helping people learn a new language", "cutting energy use at home",
      "planning trips with friends", "keeping track of shared expenses",
      "finding accessible places in a city", "sorting recycling correctly",
      "practising for job interviews" ] },
    { key: "Technology", items: [
      "a chatbot", "a browser extension", "a mobile app", "computer vision",
      "a voice assistant", "a map API", "a Telegram bot", "a data dashboard",
      "a game", "a wearable sensor" ] },
    { key: "Twist", items: [
      "it works offline", "it is fully accessible", "it is built for teenagers",
      "it runs on a tiny budget", "it must be fun", "it protects privacy by design",
      "it works in Finnish and English", "it can be used in 10 seconds",
      "it rewards teamwork", "it has no sign-up" ] }
  ];

  const state = DATA.map(d => ({ value: d.items[0], locked: false }));
  const slotsEl = document.getElementById("slots");
  const pitchEl = document.getElementById("pitch");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pick(items, current) {
    let next;
    do { next = items[Math.floor(Math.random() * items.length)]; } while (next === current);
    return next;
  }

  function render() {
    slotsEl.innerHTML = "";
    DATA.forEach((d, i) => {
      const div = document.createElement("div");
      div.className = "slot" + (state[i].locked ? " locked" : "");
      div.innerHTML = `<div><p class="label">${d.key}</p><p class="value">${state[i].value}</p></div>`;
      const btn = document.createElement("button");
      btn.textContent = state[i].locked ? "Unlock" : "Lock";
      btn.setAttribute("aria-pressed", state[i].locked);
      btn.addEventListener("click", () => { state[i].locked = !state[i].locked; render(); });
      div.appendChild(btn);
      slotsEl.appendChild(div);
    });
    const [p, t, w] = state.map(s => s.value);
    pitchEl.textContent = `Build ${t} for ${p}, where ${w}.`;
  }

  function spin() {
    let ticks = reduceMotion ? 1 : 8;
    const timer = setInterval(() => {
      state.forEach((s, i) => { if (!s.locked) s.value = pick(DATA[i].items, s.value); });
      render();
      if (--ticks <= 0) clearInterval(timer);
    }, 70);
  }

  document.getElementById("spin").addEventListener("click", spin);
  spin();
</script>
</body>
</html>
